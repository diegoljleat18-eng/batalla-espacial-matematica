<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Batalla Espacial Matemática</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#162d64,#06091d 70%);color:#fff;font-family:system-ui,sans-serif;min-height:100vh;padding:18px}main{max-width:780px;margin:auto}h1{text-align:center;color:#a5f3fc;font-size:clamp(24px,5vw,38px)}.panel{background:#101b39e8;border:1px solid #3b5487;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 10px 30px #0005}input,button{font:inherit;border-radius:10px;padding:12px;border:0}input{width:100%;background:#e9f2ff;color:#0c1630;margin:7px 0 12px}button{background:#22d3ee;color:#061329;font-weight:800;cursor:pointer;margin:4px}button:disabled{opacity:.45}button.secondary{background:#a78bfa}button.answer{font-size:25px;min-width:90px;min-height:70px}.hidden{display:none}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}.big{text-align:center;font-size:clamp(38px,9vw,64px);font-weight:900;color:#fef08a;margin:20px}.muted{color:#b9c8e8}.players{display:grid;gap:8px}.player{display:flex;justify-content:space-between;background:#1e3159;padding:12px;border-radius:9px}.ship{text-align:center;font-size:70px;animation:float 2s infinite alternate}@keyframes float{to{transform:translateY(-10px)}}.center{text-align:center}.status{min-height:24px;color:#fde68a}</style></head><body><main><h1>🚀 BATALLA ESPACIAL MATEMÁTICA</h1><p class="center muted">Hasta 5 jugadores · Una sala · Celulares diferentes</p><section id="lobby" class="panel"><label>Tu nombre</label><input id="name" maxlength="20" placeholder="Ej. Ana"><div class="row"><button id="create">Crear sala (docente)</button></div><p class="center">o únete a una sala</p><input id="codeInput" inputmode="numeric" maxlength="6" placeholder="Código de 6 dígitos"><div class="row"><button class="secondary" id="join">Unirme a la batalla</button></div></section><section id="room" class="panel hidden"><h2 class="center">Sala <span id="code"></span></h2><p id="role" class="center muted"></p><div id="waiting" class="center"><p>Comparte el código con tus alumnos. Máximo 5 participantes.</p><button id="start" class="hidden">🚀 Iniciar batalla</button></div><div id="game" class="hidden"><div class="ship">🛸 👾 🚀</div><p class="center">Nivel <b id="level"></b> · Pregunta <b id="round"></b>/25 · ⏱️ <b id="time"></b>s</p><div id="question" class="big"></div><div class="row" id="answers"></div><p id="feedback" class="center status"></p></div><h3>🏆 Clasificación en vivo</h3><div id="players" class="players"></div></section><p id="error" class="center status"></p><div class="center"><button class="secondary" id="sound">🔊 Sonido activado</button></div></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io();let host=false,me='',currentRound=0,answered=false,sound=true,audio;const $=id=>document.getElementById(id);function beep(freq=440,duration=.13){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=freq;g.gain.setValueAtTime(.08,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.start();o.stop(audio.currentTime+duration)}catch{}}function showError(msg){$('error').textContent=msg;beep(180)}function enter(r){if(r.error)return showError(r.error);host=r.host;me=socket.id;$('lobby').classList.add('hidden');$('room').classList.remove('hidden');$('code').textContent=r.code;$('role').textContent=host?'Eres anfitrión':'Esperando al docente';$('start').classList.toggle('hidden',!host);beep(700)}$('create').onclick=()=>socket.emit('create',{name:$('name').value},enter);$('join').onclick=()=>socket.emit('join',{name:$('name').value,code:$('codeInput').value},enter);$('start').onclick=()=>socket.emit('start');$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 Sonido activado':'🔇 Sonido desactivado';if(sound)beep()};
function options(q){const answer=solve(q),set=new Set([answer]);while(set.size<4){let delta=Math.floor(Math.random()*21)-10;if(delta===0)continue;set.add(answer+delta)}return [...set].sort(()=>Math.random()-.5)}function solve(q){const [a,op,b]=q.match(/-?\d+|[+×÷-]/g);return op==='+'?+a+(+b):op==='-'?a-b:op==='×'?a*b:a/b}function renderOptions(q){$('answers').replaceChildren();for(const val of options(q)){const b=document.createElement('button');b.className='answer';b.textContent=val;b.onclick=()=>{if(answered)return;answered=true;document.querySelectorAll('.answer').forEach(x=>x.disabled=true);socket.emit('answer',val,r=>{if(r.error)return showError(r.error);$('feedback').textContent=r.correct?'🎯 ¡Impacto! + puntos':'💥 Escudo dañado. Respuesta: '+r.answer;beep(r.correct?880:170,.3)})};$('answers').append(b)}}socket.on('state',s=>{if(s.round!==currentRound&&s.started){currentRound=s.round;answered=false;$('feedback').textContent='';renderOptions(s.question);beep(540)}$('waiting').classList.toggle('hidden',s.started);$('game').classList.toggle('hidden',!s.started);$('level').textContent=s.level;$('round').textContent=s.round;$('time').textContent=s.remaining??0;$('question').textContent=s.question||'';const p=s.players.find(x=>x.id===me);if(p?.answered){answered=true;document.querySelectorAll('.answer').forEach(x=>x.disabled=true)}$('players').replaceChildren();for(const p of [...s.players].sort((a,b)=>b.score-a.score)){const div=document.createElement('div');div.className='player';div.textContent=(p.id===me?'⭐ ':'')+p.name+' · 🛡️ '+p.shield+'  —  '+p.score+' pts';$('players').append(div)}});socket.on('finished',s=>{const winner=[...s.players].sort((a,b)=>b.score-a.score)[0];$('feedback').textContent='🏆 ¡Fin de partida! Ganador: '+(winner?.name||'Sin participantes');beep(990,.5);$('start').textContent='Jugar de nuevo';currentRound=0});socket.on('closed',()=>{alert('El anfitrión cerró la sala.');location.reload()});setInterval(()=>{const t=$('time');if(!$('game').classList.contains('hidden')&&+t.textContent>0)t.textContent=+t.textContent-1},1000);
</script></body></html>
